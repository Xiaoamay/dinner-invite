<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120914" />
  <title>给范同学的晚餐邀请</title>
  <style>
    :root {
      --bg1: #120914;
      --bg2: #2a1022;
      --pink: #ff8fbe;
      --pink2: #ffd3e4;
      --cream: #fff6fa;
      --muted: #d9bdcd;
      --glass: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.15);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,143,190,.16), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(197,96,180,.13), transparent 30%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }
    .stars, .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .stars::before, .stars::after {
      content: ""; position: absolute; inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.65) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,182,215,.45) 0 1px, transparent 1.5px);
      background-size: 90px 90px, 130px 130px;
      background-position: 10px 20px, 50px 75px;
      opacity: .45;
      animation: drift 18s linear infinite;
    }
    .stars::after { transform: scale(1.4); opacity: .18; animation-duration: 28s; }
    @keyframes drift { to { transform: translate3d(45px,30px,0); } }

    .wrap { min-height: 100svh; display: grid; place-items: center; padding: 28px 18px 42px; position: relative; z-index: 2; }
    .card {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 56px) clamp(22px, 6vw, 52px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: 0 25px 80px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      text-align: center;
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } }

    .kicker { letter-spacing: .24em; text-transform: uppercase; font-size: 11px; color: var(--pink2); opacity: .82; }
    .heart { font-size: 34px; margin: 8px 0 10px; animation: beat 2.1s ease-in-out infinite; display: inline-block; }
    @keyframes beat { 0%,100%{ transform: scale(1);} 12%{transform:scale(1.12);} 24%{transform:scale(1);} }
    h1 { margin: 0; font-family: Georgia, "STSong", serif; font-size: clamp(40px, 11vw, 72px); font-weight: 500; letter-spacing: .03em; line-height: 1.05; }
    .sub { margin: 13px 0 0; font-size: clamp(16px,4.3vw,20px); color: var(--muted); }

    .message {
      margin: 30px auto 24px;
      max-width: 520px;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(18px, 4.6vw, 23px);
      line-height: 1.9;
      color: #fff7fb;
    }
    .message em { color: var(--pink2); font-style: normal; }

    .details {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin: 26px 0;
    }
    .item { padding: 15px 10px; border-radius: 18px; background: var(--glass); border: 1px solid rgba(255,255,255,.10); }
    .icon { font-size: 20px; margin-bottom: 7px; }
    .label { font-size: 11px; color: #c9aabc; letter-spacing: .08em; }
    .value { margin-top: 5px; font-size: 14px; line-height: 1.45; }

    .question { margin: 28px 0 15px; color: #f4dce8; font-size: 15px; }
    .actions { display: grid; gap: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 15px 20px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      font-family: inherit;
    }
    .yes { color: #3b1027; background: linear-gradient(90deg, #ffd7e8, #ff9fc4); box-shadow: 0 12px 28px rgba(255,143,190,.22); }
    .maybe { color: #f5dce8; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.13); }
    button:active { transform: scale(.98); }
    .tiny { margin-top: 18px; color: #af8da0; font-size: 12px; }

    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(14,6,15,.72); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 10; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .modal { width: min(520px,100%); text-align: center; padding: 38px 24px; border-radius: 28px; background: linear-gradient(180deg, rgba(49,19,40,.97), rgba(24,10,24,.98)); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 35px 100px rgba(0,0,0,.5); transform: translateY(14px) scale(.98); transition: transform .35s ease; }
    .overlay.show .modal { transform: none; }
    .big { font-size: 58px; }
    .modal h2 { margin: 10px 0 10px; font-family: Georgia, "STSong", serif; font-size: 34px; font-weight: 500; }
    .modal p { color: #e9cfdd; line-height: 1.8; margin: 0 auto 24px; max-width: 400px; }
    .close { color: #5a173e; background: #ffd5e7; }

    .burst { position: fixed; left: 50%; top: 52%; font-size: 20px; z-index: 20; pointer-events: none; animation: burst 1.35s ease-out forwards; }
    @keyframes burst { from { opacity: 0; transform: translate(-50%,-50%) scale(.7); } 12% { opacity:1; } to { opacity:0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.5) rotate(var(--r)); } }

    @media (max-width: 560px) {
      .details { grid-template-columns: 1fr; }
      .item { display: grid; grid-template-columns: 32px 1fr; grid-template-rows: auto auto; text-align:left; column-gap: 5px; align-items:center; }
      .icon { grid-row: 1 / 3; font-size: 21px; }
      .label { font-size: 10px; }
      .value { margin-top: 1px; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="wrap">
    <section class="card" aria-label="晚餐邀请">
      <div class="kicker">A little invitation for you</div>
      <div class="heart">♡</div>
      <h1>范同学</h1>
      <div class="sub">有一顿晚餐，想认真邀请你。</div>

      <p class="message">
        我想把今晚的一点点时间，<br />
        留给一场 <em>只属于我们的晚餐</em>。
      </p>

      <div class="details">
        <div class="item"><div class="icon">📅</div><div class="label">DATE</div><div class="value">2026年8月24日</div></div>
        <div class="item"><div class="icon">🕖</div><div class="label">TIME</div><div class="value">晚上 7:00</div></div>
        <div class="item"><div class="icon">📍</div><div class="label">PLACE</div><div class="value">男海街小学</div></div>
      </div>

      <div class="question">所以，范同学，你愿意赴约吗？</div>
      <div class="actions">
        <button class="yes" id="yesBtn">♡ 好呀，晚餐见</button>
        <button class="maybe" id="maybeBtn">让我想一想</button>
      </div>
      <div class="tiny">一份认真准备的小邀请 · 点击按钮看看会发生什么</div>
    </section>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="big">💗</div>
      <h2 id="modalTitle">那就说定啦</h2>
      <p id="modalText">2026年8月24日，晚上 7:00。<br />我会期待在男海街小学见到你。</p>
      <button class="close" id="closeBtn">我知道啦 ♡</button>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const yesBtn = document.getElementById('yesBtn');
    const maybeBtn = document.getElementById('maybeBtn');
    const closeBtn = document.getElementById('closeBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');

    function openModal(title, text) {
      modalTitle.textContent = title;
      modalText.innerHTML = text;
      overlay.classList.add('show');
    }
    function burstHearts() {
      const hearts = ['❤','♡','✨','✦','💗','💞'];
      for (let i = 0; i < 22; i++) {
        const el = document.createElement('div');
        el.className = 'burst';
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        el.style.setProperty('--x', `${(Math.random() - .5) * 360}px`);
        el.style.setProperty('--y', `${-80 - Math.random() * 300}px`);
        el.style.setProperty('--r', `${(Math.random() - .5) * 70}deg`);
        el.style.animationDelay = `${Math.random() * .18}s`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }
    }

    yesBtn.addEventListener('click', () => {
      burstHearts();
      openModal('那就说定啦', '2026年8月24日，晚上 7:00。<br />我会期待在男海街小学见到你。');
    });

    maybeBtn.addEventListener('click', () => {
      openModal('没关系，我等你', '不用着急回答。<br />等你准备好了，再告诉我。♡');
    });

    closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('show'); });
  </script>
</body>
</html>
